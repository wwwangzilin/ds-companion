[package]
name = "ds-companion"
version = "0.0.1"
description = "DeepSeek desktop companion (P0 probe)"
authors = ["ds-companion"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

# Tauri mobile（Android）要求一个库目标：Android 的 MainActivity 通过 JNI 调 lib 里的
# mobile_entry_point。三个 crate-type 都是 Tauri 模板规定的 ——
# staticlib / cdylib 给 Android 链接用，rlib 给桌面端的 main.rs 用。
# 注意：带上这三个会略微拖慢桌面构建（cdylib 要额外链接一次），这是官方模板的既定代价。
[lib]
name = "ds_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
# tray-icon：常驻托盘（关窗不退出），这是"空闲主动"能长期活着的前提。
# 不开 image-png：那个特性要拉 image crate，本机离线缓存里没有；
# 托盘图标用打包时嵌进去的 default_window_icon()，运行时不需要解码。
tauri = { version = "2.11.3", features = ["tray-icon"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
